# wrangler.toml
name = 'line-homework-bot-2'
main = "migrations/seeds/src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true 

# ให้ import ไฟล์ .html เข้ามาเป็นสตริงได้ (Text module rule ของ Wrangler)
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = false }
]

[[d1_databases]]
binding = "DB"
database_name = "homework_db"
# แทนที่ด้วยค่าที่ได้จากคำสั่ง `npm run db:create`
database_id = "f6828504-4a7b-4ca2-992f-cb5ac811d3a2"
migrations_dir = "migrations/sql"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# ค่าที่ไม่ลับ แก้ได้ตรงนี้
LIFF_ID = "2011719923-tegLpi1N"
APP_BASE_URL = "https://line-homework-bot.YOUR-SUBDOMAIN.workers.dev"
SCHOOL_NAME = "โรงเรียนตรังคริสเตียนศึกษา"
QUIET_HOURS_START = "22"      # เริ่มงดรบกวน (ชั่วโมง ICT)
QUIET_HOURS_END = "6"         # สิ้นสุดงดรบกวน (ชั่วโมง ICT)
REMINDER_MAX_AGE_MINUTES = "720"   # จุดเตือนที่เก่ากว่านี้ถือว่าตกรอบ ไม่ส่งย้อนหลัง
OVERDUE_NOTICE_MINUTES = "60"      # แจ้ง "เลยกำหนด" หลังถึงกำหนดกี่นาที
SESSION_TTL_HOURS = "12"          # อายุ session ครู
LOGIN_MAX_ATTEMPTS = "8"          # ผิดกี่ครั้งต่อหน้าต่างเวลาแล้วล็อก
LOGIN_WINDOW_MINUTES = "15"
ALLOW_SELF_REGISTER = "true"      # ให้ครูเปิดบัญชีเองด้วยรหัสเชิญได้หรือไม่
RESET_TTL_MINUTES = "20"        # อายุลิงก์รีเซ็ต
RESET_MAX_PER_HOUR = "3"        # ขอรีเซ็ตได้กี่ครั้งต่อชั่วโมงต่อบัญชี

[observability]
enabled = true

# secrets ที่ต้องตั้งด้วย `wrangler secret put` (ห้ามใส่ในไฟล์นี้):
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN
#   TEACHER_SETUP_CODE
#   LINK_CODE_PEPPER
