<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>ตั้งรหัสผ่านใหม่</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(160deg,#1e293b,#0f172a 60%);color:#0f172a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif}
  .card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:400px;
    box-shadow:0 18px 40px rgba(2,6,23,.45)}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:13px;color:#64748b;margin:0 0 18px}
  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#334155}
  .field{margin-bottom:14px}
  input{width:100%;padding:12px 13px;border:1.5px solid #e2e8f0;border-radius:11px;
    font-size:16px;font-family:inherit;outline:none}
  input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .btn{width:100%;padding:13px;border:0;border-radius:11px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;background:#2563eb;color:#fff}
  .btn[disabled]{opacity:.55}
  .msg{padding:11px 13px;border-radius:10px;font-size:13.5px;line-height:1.55;margin-bottom:14px;display:none}
  .msg.show{display:block}
  .err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .ok{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0}
  .hint{font-size:12px;color:#64748b;margin-top:6px}
  .hidden{display:none !important}
  a{color:#2563eb;font-size:13px;display:block;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>ตั้งรหัสผ่านใหม่</h1>
  <p class="sub" id="who">กำลังตรวจสอบลิงก์…</p>
  <div id="msg" class="msg"></div>

  <form id="form" class="hidden">
    <div class="field">
      <label for="p1">รหัสผ่านใหม่</label>
      <input id="p1" type="password" autocomplete="new-password" required />
      <p class="hint">อย่างน้อย 8 ตัว มีทั้งตัวอักษรและตัวเลข</p>
    </div>
    <div class="field">
      <label for="p2">ยืนยันรหัสผ่านใหม่</label>
      <input id="p2" type="password" autocomplete="new-password" required />
    </div>
    <button type="submit" class="btn" id="btn">บันทึกรหัสผ่านใหม่</button>
  </form>

  <a href="/login" id="backLink">กลับไปหน้าเข้าสู่ระบบ</a>
</div>

<script>
(function () {
  "use strict";
  var token = new URLSearchParams(window.location.search).get("token") || "";
  var el = function (id) { return document.getElementById(id); };
  var msg = el("msg");

  function show(cls, text) { msg.className = "msg show " + cls; msg.textContent = text; }

  // ลบ token ออกจาก address bar ทันที กันหลุดไปกับ history/แคปหน้าจอ
  if (token) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  if (!token) {
    el("who").textContent = "";
    show("err", "ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์ใหม่จากหน้าเข้าสู่ระบบ");
    return;
  }

  fetch("/auth/reset-info?token=" + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) {
        el("who").textContent = "บัญชีของ " + (d.display_name || "ครู");
        el("form").classList.remove("hidden");
      } else {
        el("who").textContent = "";
        show("err", (d && d.error) || "ลิงก์ไม่ถูกต้อง");
      }
    })
    .catch(function () {
      el("who").textContent = "";
      show("err", "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
    });

  el("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (el("p1").value !== el("p2").value) { show("err", "รหัสผ่านทั้งสองช่องไม่ตรงกัน"); return; }

    var btn = el("btn");
    btn.disabled = true; btn.textContent = "กำลังบันทึก…";

    fetch("/auth/reset-confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, new_password: el("p1").value })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false; btn.textContent = "บันทึกรหัสผ่านใหม่";
        if (d && d.ok) {
          el("form").classList.add("hidden");
          show("ok", d.message + " กำลังพาไปหน้าเข้าสู่ระบบ…");
          setTimeout(function () { window.location.replace("/login"); }, 1800);
        } else {
          show("err", (d && d.error) || "บันทึกไม่สำเร็จ");
        }
      }).catch(function () {
        btn.disabled = false; btn.textContent = "บันทึกรหัสผ่านใหม่";
        show("err", "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
      });
  });
})();
</script>
</body>
</html>
